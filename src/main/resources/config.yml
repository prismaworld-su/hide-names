# Сообщение в action bar, которое видит игрок при нажатии ПКМ по другому игроку.
# Формат — MiniMessage: https://docs.papermc.io/adventure/minimessage/format/
#
# Плейсхолдеры:
#   %displayName%        — отображаемое имя игрока, по которому нажали;
#   %<плейсхолдер>%      — любой плейсхолдер PlaceholderAPI, вычисляется для игрока, по которому нажали
#                          (например, %player_name%, %vault_prefix%);
#   %rel_<плейсхолдер>%  — относительный плейсхолдер PlaceholderAPI (нажавший игрок → игрок, по которому нажали).
# Значения плейсхолдеров PlaceholderAPI могут содержать теги оформления MiniMessage (<yellow>, <bold>, <gradient> и др.)
# и цветовые коды (&a, §a, &#rrggbb). Например, префикс LuckPerms "<yellow>⭐</yellow>" будет жёлтым.
# Интерактивные теги (<click>, <hover>) в значениях не обрабатываются и выводятся как текст.
action-bar-format: "<gray>Игрок: <white>%displayName%"

# Сообщения плагина (формат MiniMessage).
messages:
  esp-enabled: "<green>Режим ESP включён: вы видите ники всех игроков."
  esp-disabled: "<yellow>Режим ESP выключен: ники игроков снова скрыты."
  players-only: "<red>Эту команду может выполнить только игрок."
  reloaded: "<green>Конфигурация HideNames перезагружена."
